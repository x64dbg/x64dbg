# Reference: https://build-cpp.github.io/cmkr/cmake-toml
[cmake]
version = "3.19"
cmkr-include = false

[project]
name = "ElfBug_tests"

[fetch-content.Catch2]
git = "https://github.com/catchorg/Catch2"
tag = "v3.14.0"
shallow = true

[target.ElfBug_tests]
type = "executable"
sources = ["tests.cpp"]
headers = [
    "TestHarness.h",
    "SymbolHelper.h",
]
link-libraries = ["ElfBug", "Catch2::Catch2WithMain"]
compile-features = ["cxx_std_20"]
compile-definitions = ['ELFBUG_TESTS_TARGETS_DIR="${CMAKE_BINARY_DIR}/tests/targets"']
properties.RUNTIME_OUTPUT_DIRECTORY = "${CMAKE_BINARY_DIR}/tests"
cmake-after = """
list(APPEND CMAKE_MODULE_PATH "${catch2_SOURCE_DIR}/extras")
include(Catch)
catch_discover_tests(ElfBug_tests)
add_dependencies(ElfBug_tests
    elfbug_fixture_end_immediately
    elfbug_fixture_exit_code_42
    elfbug_fixture_hello_elfbug
    elfbug_fixture_run_endlessly
    elfbug_fixture_segfault
    elfbug_fixture_multi_threaded
    elfbug_fixture_step_over_targets
    elfbug_fixture_exec_target
    elfbug_fixture_threads_spin
    elfbug_fixture_exit_race
    elfbug_fixture_signal_race
    elfbug_fixture_clone_trap
)
"""

[template.elfbug_fixture]
type = "executable"
compile-options = ["-g", "-O0", "-pie"]
link-options = ["-pie"]

[target.elfbug_fixture_end_immediately]
type = "elfbug_fixture"
sources = ["targets/end_immediately.cpp"]
properties.OUTPUT_NAME = "end_immediately"
properties.RUNTIME_OUTPUT_DIRECTORY = "${CMAKE_BINARY_DIR}/tests/targets"

