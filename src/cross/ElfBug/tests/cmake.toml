# Reference: https://build-cpp.github.io/cmkr/cmake-toml
[cmake]
version = "3.19"
cmkr-include = false

[project]
name = "ElfBug_tests"

[fetch-content.Catch2]
git = "https://github.com/catchorg/Catch2"
tag = "v3.14.0"
shallow = true

[target.ElfBug_tests]
type = "executable"
sources = [
    "test_api.cpp",
    "test_attach.cpp",
    "test_breakpoints.cpp",
    "test_detach.cpp",
    "test_elf_image.cpp",
    "test_lifecycle.cpp",
    "test_memory_map.cpp",
    "test_memory_map_api.cpp",
    "test_multithread.cpp",
    "test_procfs.cpp",
    "test_signals.cpp",
    "test_stepping.cpp",
    "test_suspend.cpp",
    "api_c_compat.c",
]
headers = [
    "TestHarness.h",
    "TestSupport.h",
    "SymbolHelper.h",
    "ApiSession.h",
    "targets/TargetUtil.h",
]
link-libraries = ["ElfBug", "Catch2::Catch2WithMain"]
compile-features = ["cxx_std_20", "c_std_11"]
compile-definitions = ['ELFBUG_TESTS_TARGETS_DIR="${CMAKE_BINARY_DIR}/tests/targets"']
properties.RUNTIME_OUTPUT_DIRECTORY = "${CMAKE_BINARY_DIR}/tests"
properties.C_STANDARD = 11
properties.C_STANDARD_REQUIRED = true
# The per-file helper namespaces would collide if these were concatenated.
properties.UNITY_BUILD = false
cmake-after = """
list(APPEND CMAKE_MODULE_PATH "${catch2_SOURCE_DIR}/extras")
include(Catch)
catch_discover_tests(ElfBug_tests)
add_dependencies(ElfBug_tests
    elfbug_fixture_end_immediately
    elfbug_fixture_exit_code_42
    elfbug_fixture_hello_elfbug
    elfbug_fixture_run_endlessly
    elfbug_fixture_segfault
    elfbug_fixture_int3_target
    elfbug_fixture_multi_threaded
    elfbug_fixture_step_over_targets
    elfbug_fixture_exec_target
    elfbug_fixture_exec_peer_a
    elfbug_fixture_exec_peer_b
    elfbug_fixture_threads_spin
    elfbug_fixture_exit_race
    elfbug_fixture_signal_race
    elfbug_fixture_clone_trap
    elfbug_fixture_thread_storm
    elfbug_fixture_signal_pending
    elfbug_fixture_signal_storm
    elfbug_fixture_clone_relay
    elfbug_fixture_clone_process
    elfbug_fixture_vfork_wait
    elfbug_fixture_vfork_signal
    elfbug_fixture_mem_map_target
    elfbug_fixture_mm_gap
    elfbug_fixture_mm_data
    elfbug_fixture_huge_text_target
    elfbug_fixture_static_target
    elfbug_fixture_static_pie_target
)
"""

