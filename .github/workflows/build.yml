name: Build

on: [push, pull_request]

# Automatically cancel previous runs of this workflow on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cmake:
    # Skip building pull requests from the same repository
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Visual Studio Development Environment
        uses: TheMrMilchmann/setup-msvc-dev@79dac248aac9d0059f86eae9d8b5bfab4e95e97c # v4.0.0
        with:
          arch: ${{ matrix.arch }}

      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_UNITY_BUILD=ON -DCMAKE_UNITY_BUILD_BATCH_SIZE=6 -DX64DBG_RELEASE=${{ startsWith(github.ref, 'refs/tags/') && 'ON' || 'OFF' }}
          cmake --build build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.arch }}
          path: bin
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  docs:
    # Skip building pull requests from the same repository
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Build Documentation
        run: |
          docs\makechm.bat

      - name: Upload Documentation
        uses: actions/upload-artifact@v7
        with:
          name: docs
          path: docs/x64dbg.chm
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  test:
    needs: cmake
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
        engine: [TitanEngine, GleeBug]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-${{ matrix.arch }}
          path: bin

      - name: Run Tests
        shell: pwsh
        run: |
          $artifactDir = Join-Path $PWD "test-artifacts/${{ matrix.arch }}-${{ matrix.engine }}"
          $dumpDir = Join-Path $artifactDir "crash-dumps"
          # WER LocalDumps uses HKLM, not HKCU. Configure both registry views so
          # the x86 host also produces a dump on the 64-bit runner.
          foreach ($view in @([Microsoft.Win32.RegistryView]::Registry64, [Microsoft.Win32.RegistryView]::Registry32)) {
            $hive = [Microsoft.Win32.RegistryKey]::OpenBaseKey([Microsoft.Win32.RegistryHive]::LocalMachine, $view)
            $key = $hive.CreateSubKey("Software\Microsoft\Windows\Windows Error Reporting\LocalDumps\headless.exe")
            try {
              $key.SetValue("DumpFolder", $dumpDir, [Microsoft.Win32.RegistryValueKind]::ExpandString)
              $key.SetValue("DumpType", 2, [Microsoft.Win32.RegistryValueKind]::DWord)
              $key.SetValue("DumpCount", 4, [Microsoft.Win32.RegistryValueKind]::DWord)
            } finally {
              $key.Dispose()
              $hive.Dispose()
            }
          }
          Write-Host "Full headless crash dumps will be written to $dumpDir"
          py src/tests/run.py --arch ${{ matrix.arch }} --engine ${{ matrix.engine }} --artifacts-dir $artifactDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Exercise the intermittent x86 GleeBug shutdown path without masking
          # either a full-suite failure or a failed stress iteration.
          if ("${{ matrix.arch }}" -eq "x86" -and "${{ matrix.engine }}" -eq "GleeBug") {
            for ($attempt = 1; $attempt -le 20; $attempt++) {
              $stressDir = Join-Path $artifactDir "pause-run-stress-$attempt"
              py src/tests/run.py --arch x86 --engine GleeBug --artifacts-dir $stressDir trace_party/pause-run
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }

      - name: Upload Test Artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts-${{ matrix.arch }}-${{ matrix.engine }}
          path: test-artifacts/${{ matrix.arch }}-${{ matrix.engine }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  package:
    needs: [cmake, docs]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download x64 Artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-x64
          path: bin

      - name: Download x86 Artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-x86
          path: bin

      - name: Download Documentation
        uses: actions/download-artifact@v8
        with:
          name: docs
          path: docs

      - name: Prepare Release
        run: |
          curl.exe -L https://github.com/x64dbg/translations/releases/download/translations/qm.zip -o bin\qm.zip
          7z x bin\qm.zip -obin
          cmake -P .\cmake\release.cmake
          $timestamp = Get-Date (Get-Date).ToUniversalTime() -Format "yyyy-MM-dd_HH-mm"
          echo "timestamp=$timestamp" >> $env:GITHUB_ENV

      - name: Upload Snapshot
        uses: actions/upload-artifact@v7
        with:
          name: snapshot_${{ env.timestamp }}
          path: |
            release/pluginsdk
            release/release
            release/commithash.txt
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 9

      - name: Upload Symbols
        uses: actions/upload-artifact@v7
        with:
          name: symbols-snapshot_${{ env.timestamp }}
          path: |
            release/pdb
            release/commithash.txt
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 9

      - name: Upload Plugin SDK
        uses: actions/upload-artifact@v7
        with:
          name: x64dbg-pluginsdk
          path: |
            release/pluginsdk
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 9
